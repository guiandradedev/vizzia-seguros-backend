services:
  api:
    container_name: nest-api
    build:
      context: .
      target: builder
    command: npm run start:dev
    env_file:
      - .env
    ports:
      - '3001:3001' # Mapeia a porta 3001 do host para 3000 do contêiner
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - redis
      - db
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${UID}:${GID}"
    environment:
      REDIS_HOST: redis # Este é o nome do serviço Redis abaixo
      REDIS_PORT: 6379

  db:
    container_name: postgres-db
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data: